aid: nominatim
name: Nominatim
description: >-
  Nominatim is an open-source (BSD-2-Clause) search engine for OpenStreetMap data, supporting forward geocoding (address
  to coordinates), reverse geocoding (coordinates to address), and address lookup by OSM ID. The OpenStreetMap
  Foundation runs a free public instance at nominatim.openstreetmap.org under a published usage policy, and the project
  is also widely self-hosted and resold by commercial providers (MapTiler, LocationIQ, Geocode Earth).
